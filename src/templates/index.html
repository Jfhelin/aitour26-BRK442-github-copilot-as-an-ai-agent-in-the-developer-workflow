<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #1a73e8;
            color: #fff;
            padding: 1rem 2rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.75rem;
        }

        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Form Section */
        .form-section {
            background: #fff;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-section h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #1a73e8;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.2);
        }

        .form-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.5rem 1.25rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:focus-visible {
            outline: 3px solid #1a73e8;
            outline-offset: 2px;
        }

        .btn-primary {
            background-color: #1a73e8;
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #1557b0;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: #fff;
        }

        .btn-secondary:hover {
            background-color: #565e64;
        }

        .btn-danger {
            background-color: #dc3545;
            color: #fff;
        }

        .btn-danger:hover {
            background-color: #bb2d3b;
        }

        .btn-edit {
            background-color: #ffc107;
            color: #333;
        }

        .btn-edit:hover {
            background-color: #e0a800;
        }

        /* Products List */
        .products-section h2 {
            font-size: 1.25rem;
            color: #1a73e8;
        }

        .product-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .product-item {
            background: #fff;
            border-radius: 8px;
            padding: 1rem 1.5rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .product-info {
            flex: 1;
            min-width: 200px;
        }

        .product-info h3 {
            margin: 0 0 0.25rem 0;
            font-size: 1.1rem;
        }

        .product-info p {
            margin: 0;
            color: #666;
            font-size: 0.95rem;
        }

        .product-category {
            display: inline-block;
            background-color: #e8f0fe;
            color: #1a73e8;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 0.25rem;
        }

        .product-actions {
            display: flex;
            gap: 0.5rem;
        }

        /* Status Messages */
        .status-message {
            padding: 0.75rem 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .status-message.error {
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }

        .status-message.success {
            background-color: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }

        .status-message.loading {
            background-color: #cfe2ff;
            color: #084298;
            border: 1px solid #b6d4fe;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.35rem;
            }

            .product-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .product-actions {
                width: 100%;
            }

            .product-actions .btn {
                flex: 1;
            }
        }

        /* Skip link for accessibility */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #1a73e8;
            color: #fff;
            padding: 8px;
            z-index: 100;
        }

        .skip-link:focus {
            top: 0;
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header>
        <h1>Product Store</h1>
    </header>

    <main id="main-content">
        <!-- Status message area -->
        <div id="status" role="status" aria-live="polite"></div>

        <!-- Add / Edit Product Form -->
        <section class="form-section" aria-labelledby="form-heading">
            <h2 id="form-heading">Add Product</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label for="product-name">Name <span aria-hidden="true">*</span></label>
                    <input type="text" id="product-name" required
                        aria-required="true" placeholder="Enter product name">
                </div>
                <div class="form-group">
                    <label for="product-description">Description</label>
                    <textarea id="product-description"
                        placeholder="Enter product description"></textarea>
                </div>
                <div class="form-group">
                    <label for="product-category">Category</label>
                    <select id="product-category">
                        <option value="">-- Select a category --</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Garden &amp; Outdoor">Garden &amp; Outdoor</option>
                        <option value="Hand tools">Hand tools</option>
                        <option value="Hardware">Hardware</option>
                        <option value="Lumber &amp; Building materials">Lumber &amp; Building materials</option>
                        <option value="Paint &amp; Finishes">Paint &amp; Finishes</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Power tools">Power tools</option>
                        <option value="Storage &amp; organization">Storage &amp; organization</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submit-btn">Add Product</button>
                    <button type="button" class="btn btn-secondary" id="cancel-btn"
                        style="display:none;">Cancel</button>
                </div>
            </form>
        </section>

        <!-- Product List -->
        <section class="products-section" aria-labelledby="products-heading">
            <h2 id="products-heading">Products</h2>
            <ul class="product-list" id="product-list" aria-label="Product list">
            </ul>
        </section>
    </main>

    <script>
        const API_URL = '/products';
        const form = document.getElementById('product-form');
        const nameInput = document.getElementById('product-name');
        const descInput = document.getElementById('product-description');
        const categorySelect = document.getElementById('product-category');
        const idInput = document.getElementById('product-id');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const formHeading = document.getElementById('form-heading');
        const productList = document.getElementById('product-list');
        const statusDiv = document.getElementById('status');

        cancelBtn.addEventListener('click', cancelEdit);

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status-message ' + type;
            if (type !== 'loading') {
                setTimeout(function () {
                    statusDiv.textContent = '';
                    statusDiv.className = '';
                }, 4000);
            }
        }

        function clearStatus() {
            statusDiv.textContent = '';
            statusDiv.className = '';
        }

        async function fetchProducts() {
            showStatus('Loading products…', 'loading');
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('Failed to load products');
                const products = await res.json();
                renderProducts(products);
                clearStatus();
            } catch (err) {
                showStatus('Error loading products. Please try again.', 'error');
            }
        }

        function renderProducts(products) {
            productList.innerHTML = '';
            if (products.length === 0) {
                productList.innerHTML = '<li class="empty-state">No products yet. Add one above!</li>';
                return;
            }
            products.forEach(function (product) {
                const li = document.createElement('li');
                li.className = 'product-item';
                li.setAttribute('data-id', product.id);

                const info = document.createElement('div');
                info.className = 'product-info';

                const h3 = document.createElement('h3');
                h3.textContent = product.name;
                info.appendChild(h3);

                const p = document.createElement('p');
                p.textContent = product.description || 'No description';
                info.appendChild(p);

                if (product.category) {
                    const cat = document.createElement('span');
                    cat.className = 'product-category';
                    cat.textContent = product.category;
                    info.appendChild(cat);
                }

                const actions = document.createElement('div');
                actions.className = 'product-actions';

                const editBtn = document.createElement('button');
                editBtn.className = 'btn btn-edit';
                editBtn.textContent = 'Edit';
                editBtn.setAttribute('aria-label', 'Edit ' + product.name);
                editBtn.onclick = function () { startEdit(product); };

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-danger';
                deleteBtn.textContent = 'Delete';
                deleteBtn.setAttribute('aria-label', 'Delete ' + product.name);
                deleteBtn.onclick = function () { deleteProduct(product.id, product.name); };

                actions.appendChild(editBtn);
                actions.appendChild(deleteBtn);

                li.appendChild(info);
                li.appendChild(actions);
                productList.appendChild(li);
            });
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            const name = nameInput.value.trim();
            const description = descInput.value.trim();
            const category = categorySelect.value;

            if (!name) {
                showStatus('Product name is required.', 'error');
                nameInput.focus();
                return;
            }

            const editId = idInput.value;
            try {
                let res;
                if (editId) {
                    res = await fetch(API_URL + '/' + editId, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name, description: description, category: category })
                    });
                    if (!res.ok) throw new Error('Failed to update product');
                    showStatus('Product updated successfully!', 'success');
                } else {
                    res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name, description: description, category: category })
                    });
                    if (!res.ok) throw new Error('Failed to add product');
                    showStatus('Product added successfully!', 'success');
                }
                resetForm();
                fetchProducts();
            } catch (err) {
                showStatus(err.message || 'An error occurred. Please try again.', 'error');
            }
        });

        function startEdit(product) {
            idInput.value = product.id;
            nameInput.value = product.name;
            descInput.value = product.description || '';
            categorySelect.value = product.category || '';
            formHeading.textContent = 'Edit Product';
            submitBtn.textContent = 'Update Product';
            cancelBtn.style.display = 'inline-block';
            nameInput.focus();
        }

        function cancelEdit() {
            resetForm();
        }

        function resetForm() {
            idInput.value = '';
            nameInput.value = '';
            descInput.value = '';
            categorySelect.value = '';
            formHeading.textContent = 'Add Product';
            submitBtn.textContent = 'Add Product';
            cancelBtn.style.display = 'none';
        }

        async function deleteProduct(id, name) {
            if (!confirm('Are you sure you want to delete "' + name + '"?')) return;
            try {
                const res = await fetch(API_URL + '/' + id, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed to delete product');
                showStatus('Product deleted successfully!', 'success');
                fetchProducts();
            } catch (err) {
                showStatus('Error deleting product. Please try again.', 'error');
            }
        }

        // Load products on page load
        fetchProducts();
    </script>
</body>
</html>
